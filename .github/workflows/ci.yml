name: .NET Continuous Integration

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Restaurar paquetes
        run: dotnet restore MedCareOS.slnx

      - name: 4. Compilar la solución
        run: dotnet build MedCareOS.slnx --no-restore --configuration Release

      - name: 5. Ejecutar Pruebas Unitarias
        run: dotnet test MedCareOS.slnx --no-build --configuration Release --verbosity normal